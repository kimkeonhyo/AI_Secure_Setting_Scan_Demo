# AI 서버 보안 실증 대상 인벤토리
# (1) VM 자체에서 실행: connection=local (기본)
# (2) 원격(호스트 -> VM, VirtualBox NAT 2222->22)은 아래 예시 사용

[secure_servers]
localhost ansible_connection=local

# [secure_servers]
# demo-vm ansible_host=127.0.0.1 ansible_port=2222 ansible_user=rocky

[secure_servers:vars]
ansible_python_interpreter=/usr/bin/python3

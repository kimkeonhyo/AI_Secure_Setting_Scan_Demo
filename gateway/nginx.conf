user  nginx;
worker_processes  auto;
events { worker_connections 1024; }

http {
    default_type application/json;

    # 초당이 아닌 분당 10회로 제한 (rate limit 시연이 쉽도록)
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/m;

    # 발급된 토큰만 허용 (인증된 요청만 통과)
    map $http_authorization $authok {
        default                                 0;
        "Bearer demo-secret-token-123"          1;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;          # TLS 1.3 강제

        location / {
            if ($authok = 0) { return 401 '{"error":"unauthorized: valid Bearer token required"}\n'; }
            limit_req zone=perip burst=3 nodelay;   # 초과 시 429
            proxy_pass http://inference:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

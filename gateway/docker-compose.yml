services:
  inference:
    build: ./backend
    image: poc-inference:latest
    networks: [ai_internal]
    expose:
      - "8000"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [ai_internal, edge]
    depends_on: [inference]
    restart: unless-stopped

networks:
  edge: {}
  ai_internal:
    internal: true   # inference 컨테이너는 외부로 나갈 수 없음 (egress 차단 시연)
